name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q myrepro.zip
      - run: |
          sed -i 's/class MixEngine(ctx/class MixEngine(private val ctx/' myrepro/app/src/main/java/com/myrepro/MixEngine.kt
          echo "android.useAndroidX=true" > myrepro/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> myrepro/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: "8.5", cache-disabled: true }
      - run: gradle -p myrepro assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyRepro-apk
          path: myrepro/app/build/outputs/apk/debug/app-debug.apk
